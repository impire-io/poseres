[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poseres"
version = "0.1.0"
description = "Pose Resolution Architecture — validation harness and batched in-memory core"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
authors = [{ name = "Daan Gerits" }]
dependencies = ["numpy>=2.4"]

[project.urls]
Homepage = "https://github.com/impire-io/poseres"
Source = "https://github.com/impire-io/poseres"
"Bug Tracker" = "https://github.com/impire-io/poseres/issues"

[project.optional-dependencies]
# The Gymnasium adapter (feature 007) — optional at runtime, always present in
# dev so the quality gate exercises its tests (repo rule: none skipped).
gym = ["gymnasium>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "gymnasium>=1.0"]

[project.scripts]
pra-validate = "pra.harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["design", "archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
