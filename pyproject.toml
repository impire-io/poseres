[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poseres"
version = "0.1.0"
description = "Pose Resolution Architecture — validation harness and batched in-memory core"
readme = "README.md"
# >=3.12 since feature 013: ROS 2 LTS containers bind rclpy to Ubuntu 24.04's
# CPython 3.12, and the full quality-gate suite (incl. the byte-frozen baseline
# values) was run green on 3.12.8 before this was relaxed — measured, not hoped.
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
authors = [{ name = "Daan Gerits" }]
dependencies = ["numpy>=2.4"]

[project.urls]
Homepage = "https://github.com/impire-io/poseres"
Source = "https://github.com/impire-io/poseres"
"Bug Tracker" = "https://github.com/impire-io/poseres/issues"

[project.optional-dependencies]
# The Gymnasium adapter (feature 007) — optional at runtime, always present in
# dev so the quality gate exercises its tests (repo rule: none skipped).
gym = ["gymnasium>=1.0"]
# The NATS bus backend (feature 014) — pip-installable, so the extra honestly
# exists; the quality gate never imports it (the fake transport carries the
# contract; the worked example carries the integration proof).
nats = ["nats-py>=2.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "gymnasium>=1.0"]

[project.scripts]
pra-validate = "pra.harness.cli:main"
pra-rover = "pra.examples.rover.cli:main"
pra-dash = "pra.dash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pra.examples.rover" = ["*.html"]
"pra.dash" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["design", "hq", "archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
