[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poseres"
version = "1.3.0"
description = "Pose Resolution Architecture — validation harness and batched in-memory core"
readme = "README.md"
# >=3.12 since feature 013: ROS 2 LTS containers bind rclpy to Ubuntu 24.04's
# CPython 3.12, and the full quality-gate suite (incl. the byte-frozen baseline
# values) was run green on 3.12.8 before this was relaxed — measured, not hoped.
requires-python = ">=3.12"
# Fair-code: the Sustainable Use License (journey 0067). No OSI classifier —
# SUL is source-available, not OSI-approved; versions ≤ v1.1.0 remain MIT.
license = { file = "LICENSE" }
authors = [{ name = "Daan Gerits" }]
dependencies = ["numpy>=2.4"]

[project.urls]
Homepage = "https://github.com/impire-io/poseres"
Source = "https://github.com/impire-io/poseres"
"Bug Tracker" = "https://github.com/impire-io/poseres/issues"

[project.optional-dependencies]
# The Gymnasium adapter (feature 007) — optional at runtime, always present in
# dev so the quality gate exercises its tests (repo rule: none skipped).
gym = ["gymnasium>=1.0"]
# The NATS bus backend (feature 014) — pip-installable, so the extra honestly
# exists; the quality gate never imports it (the fake transport carries the
# contract; the worked example carries the integration proof).
nats = ["nats-py>=2.9"]
# The observatory flusher's S3 client (feature 032) — same honesty pattern:
# the gate carries the flusher core with the DirSink, never importing boto3.
s3 = ["boto3>=1.34"]
# ruff pinned to one minor: CI installs fresh (floating breaks the gate when
# a new ruff changes formatting — measured 2026-08-08, markdown code blocks)
dev = ["pytest>=8.0", "ruff>=0.16,<0.17", "gymnasium>=1.0"]

[project.scripts]
pra-validate = "pra.harness.cli:main"
pra-rover = "pra.examples.rover.cli:main"
pra-dash = "pra.dash.cli:main"
pra-flush = "pra.flush.cli:main"
pra-brain = "pra.persistence.brain_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pra.examples.rover" = ["*.html"]
"pra.dash" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hq", "archive", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
