# The observatory's infrastructure layer (feature 032): the world, the bus
# with its 1-hour JetStream ring buffer, and the S3 endpoint. Everything
# stateful lives under ./data/. MinIO is the default S3 (the stack is
# complete without cloud credentials); pointing pra-flush at real S3 is an
# /etc/pra/s3.env change — see ../README.md.
services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - ./data/nats:/data
    restart: unless-stopped

  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      VERSION: "1.21.11" # moves together with the bridge's mineflayer pin
      TYPE: VANILLA
      MODE: survival
      DIFFICULTY: peaceful
      ONLINE_MODE: "FALSE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "6"
      SNOOPER_ENABLED: "FALSE"
      MEMORY: 2G
    ports:
      # localhost for the node's own bridges; the tailnet address (written to
      # deploy/infra/.env by provision) for spectators. No LAN/public exposure.
      - "127.0.0.1:25565:25565"
      - "${PRA_BIND_IP:-127.0.0.1}:25565:25565"
    volumes:
      - ./data/minecraft:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pra
      MINIO_ROOT_PASSWORD: pra-observatory # localhost-bound; change if exposed
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 pra pra-observatory; do sleep 2; done;
      mc mb --ignore-existing local/pra-telemetry;
      exit 0"
    restart: "no"
